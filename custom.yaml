# ------------------------------------------------------------------
# External dependencies not in upstream rosdep
# ------------------------------------------------------------------
plantuml:
  ubuntu:
    '*': [plantuml]
python3-viser-pip:
  ubuntu:
    pip:
      packages: [viser]
python3-small_gicp-pip:
  ubuntu:
    pip:
      packages: [small_gicp]
python3-kiss-matcher-pip:
  ubuntu:
      pip:
        packages:
          - "git+https://github.com/MIT-SPARK/KISS-Matcher.git@42154f8#subdirectory=python"
